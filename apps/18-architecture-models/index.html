<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>榫构华夏 · Timber Craft Lab — 可拆解的中国传统建筑结构模型</title>
  <meta name="description" content="Six explodable 3D teaching models of Chinese traditional timber and masonry structures — dougong brackets, mortise-and-tenon joints, post-and-beam frames, open-shoulder stone arches and Fujian tulou. Procedurally generated geometry, fully offline." />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fcfbf9" />
  <!-- 内联 SVG 图标：避免任何额外网络请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%2314110f' stroke-width='2'/%3E%3Crect x='10' y='10' width='12' height='12' fill='%2314110f'/%3E%3C/svg%3E" />
  <!-- 语言备选（16-design-system/MIGRATION-NOTES.md §5「语言标记」）：
       每页提供 hreflang="zh-CN" / hreflang="en"；两版共用同一 HTML，
       由 ?lang= 参数选择（英文为默认，?lang=zh 切中文）。
       链接由 vite.config.js 的 hreflang 插件在构建期注入 —— Vite 会把
       link[href] 当静态资源解析重写，query-only URL 会导致构建失败。 -->
  <!--tcl:hreflang-->
  <link rel="stylesheet" href="./src/ui/styles.css" />
</head>
<body>
  <a class="skip-link" href="#panel-title">Skip to controls</a>

  <!-- 三维舞台 -->
  <div id="stage" role="img" aria-label="3D model viewport. Drag to orbit, scroll to zoom, click a member to inspect it.">
    <!-- 场景内双语标注层 -->
    <div id="annotations" aria-hidden="false"></div>
    <!-- 画布内 HUD：教学示意声明 + 受力箭头定性说明 -->
    <div id="hud">
      <div class="hud-chip hud-chip--disclaimer" id="hud-disclaimer" data-role="disclaimer"></div>
      <div class="hud-chip hud-chip--forces" id="hud-forces" data-role="forces-note"></div>
    </div>
  </div>

  <!-- 降级示意图容器 -->
  <div id="fallback-host" role="region" aria-label="2D schematic fallback">
    <div class="fb-wrap ds-diagram">
      <p class="fb-note" id="fallback-note"></p>
      <div id="fallback-mount"></div>
    </div>
  </div>

  <!-- 左侧索引 -->
  <nav id="rail" aria-label="Model index and site tools">
    <div class="brand">
      <span class="mark" id="brand-mark">榫构华夏</span>
      <span class="latin" id="brand-latin">Timber Craft Lab</span>
    </div>
    <div class="rail-group">
      <span class="rail-label" id="rail-models-label">Models</span>
      <div class="rail-items" id="rail-items" role="list"></div>
    </div>
    <div class="rail-spacer"></div>
    <div class="rail-tools">
      <button class="rail-btn" id="lang-toggle" type="button">中文</button>
      <button class="rail-btn" id="help-btn" type="button">?</button>
    </div>
  </nav>

  <!-- 标题 -->
  <header id="titlebar">
    <div class="eyebrow" id="model-eyebrow"></div>
    <h1 id="model-title"></h1>
    <p class="sub" id="model-sub"></p>
    <div class="badges" id="model-badges"></div>
  </header>

  <!-- 控制面板 -->
  <aside id="panel" aria-label="Model controls">
    <div class="panel-head">
      <h2 id="panel-title">Controls</h2>
      <span class="value" id="panel-count"></span>
    </div>
    <div class="panel-body" id="panel-body"></div>
  </aside>

  <!-- 构件说明 -->
  <aside id="inspector" aria-live="polite" aria-label="Selected component">
    <button class="close" id="inspector-close" type="button" aria-label="Close">×</button>
    <div class="kicker" id="insp-kicker"></div>
    <h2 id="insp-name"></h2>
    <div class="pinyin" id="insp-pinyin"></div>
    <p class="role" id="insp-role"></p>
    <div class="meta" id="insp-meta"></div>
  </aside>

  <!-- 底部圆点 -->
  <div id="dots" role="tablist" aria-label="Choose a model"></div>

  <!-- 提示 -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- 开场封面 -->
  <section id="intro">
    <div class="intro-brand" id="intro-brand">榫构华夏</div>
    <h1 id="intro-headline"></h1>
    <p class="intro-statement" id="intro-statement"></p>
    <div class="intro-meta" id="intro-meta"></div>
    <div class="intro-cta"><button class="btn" id="intro-begin" type="button">Begin</button></div>
  </section>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
