<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>ATLAS MODEL RENDER</title>
<style>
  html,body{margin:0;padding:0;background:#0C1726;}
  body{
    width:1024px;height:1024px;overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 14%, #1B3450 0%, #0C1726 56%, #05090F 100%);
  }
  canvas{display:block;width:1024px;height:1024px;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const id = params.get('id') || 'console-02';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(1024, 1024, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

/* 环境光照：RoomEnvironment 提供柔和的 PBR 反射 */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
camera.position.set(2.0, 1.1, 2.4);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.enablePan = false;
controls.target.set(0, 0.45, 0);

/* 展厅灯光 */
scene.add(new THREE.HemisphereLight(0xC6DCEE, 0x070D16, 0.40));

const key = new THREE.DirectionalLight(0xFFF4E4, 2.6);
key.position.set(2.2, 3.6, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.camera.left = -1.4;
key.shadow.camera.right = 1.4;
key.shadow.camera.top = 1.4;
key.shadow.camera.bottom = -1.4;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.014;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9FC4E8, 0.70);
fill.position.set(-2.8, 1.5, 1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xFFB37A, 0.45);
rim.position.set(-1.9, 1.9, -2.6);
scene.add(rim);

const loader = new GLTFLoader();

loader.load(
  `/public/assets/models/model-${id}.glb`,
  (gltf) => {
    const root = gltf.scene;

    /* 归一化：最大边缩放到 1.0，底面贴 y=0 */
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);
    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const k = 1.0 / maxDim;

    const wrap = new THREE.Group();
    wrap.add(root);
    root.position.x -= center.x;
    root.position.z -= center.z;
    root.position.y -= box.min.y;
    root.scale.setScalar(k);
    scene.add(wrap);

    const scaled = new THREE.Box3().setFromObject(wrap);
    const c2 = new THREE.Vector3();
    scaled.getCenter(c2);

    /* 展台 */
    const foot = Math.max(scaled.max.x - scaled.min.x, scaled.max.z - scaled.min.z) * 0.62;
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(foot, foot * 1.03, 0.045, 64),
      new THREE.MeshStandardMaterial({ color: 0x16283D, roughness: 0.62, metalness: 0.18 })
    );
    pedestal.position.y = -0.0225;
    pedestal.receiveShadow = true;
    pedestal.castShadow = true;
    scene.add(pedestal);

    const plinth = new THREE.Mesh(
      new THREE.CylinderGeometry(foot * 1.16, foot * 1.22, 0.028, 64),
      new THREE.MeshStandardMaterial({ color: 0x0E1D30, roughness: 0.7, metalness: 0.1 })
    );
    plinth.position.y = -0.058;
    plinth.receiveShadow = true;
    scene.add(plinth);

    /* 地面：径向淡出的圆形，融进背景 */
    const fadeC = document.createElement('canvas');
    fadeC.width = fadeC.height = 512;
    const g2 = fadeC.getContext('2d');
    const grad = g2.createRadialGradient(256, 256, 40, 256, 256, 250);
    grad.addColorStop(0, 'rgba(14, 30, 48, 1)');
    grad.addColorStop(0.55, 'rgba(11, 24, 40, 0.85)');
    grad.addColorStop(1, 'rgba(8, 17, 29, 0)');
    g2.fillStyle = grad;
    g2.fillRect(0, 0, 512, 512);
    const fadeTex = new THREE.CanvasTexture(fadeC);
    fadeTex.colorSpace = THREE.SRGBColorSpace;

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(4.2, 96),
      new THREE.MeshStandardMaterial({
        map: fadeTex, transparent: true, depthWrite: false,
        roughness: 0.88, metalness: 0.05,
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.072;
    floor.receiveShadow = true;
    scene.add(floor);

    /* 相机取景 */
    const radius = 1.0;
    const dist = 2.95;
    camera.position.set(dist * 0.72, c2.y + radius * 0.62, dist * 0.80);
    camera.near = radius / 60;
    camera.far = radius * 60;
    camera.updateProjectionMatrix();
    controls.target.set(0, c2.y * 0.92, 0);
    controls.minDistance = dist * 0.5;
    controls.maxDistance = dist * 2.2;
    controls.update();

    renderer.render(scene, camera);
    requestAnimationFrame(() => {
      renderer.render(scene, camera);
      window.__READY__ = true;
      window.__PART_COUNT__ = root.children.length;
      window.__DEBUG__ = {
        size: [size.x, size.y, size.z],
        k,
        scaledMin: scaled.min.toArray(),
        scaledMax: scaled.max.toArray(),
        cam: camera.position.toArray(),
        target: controls.target.toArray(),
      };
    });
  },
  undefined,
  (err) => {
    document.body.innerHTML = `<div style="color:#F0601F;font:16px monospace;padding:40px">LOAD ERROR: ${err}</div>`;
    window.__READY__ = 'error';
  }
);
</script>
</body>
</html>
