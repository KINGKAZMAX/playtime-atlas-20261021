<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>回响电玩馆 · PLAYTIME ATLAS</title>
<meta name="description" content="回响电玩馆个人作品画廊：独立作品、年代展厅与原创美术资产，可直接在线体验。" />
<meta name="theme-color" content="#faf8f4" />
<meta property="og:type" content="website" />
<meta property="og:title" content="回响电玩馆 · PLAYTIME ATLAS" />
<meta property="og:description" content="个人作品画廊：独立作品、年代展厅与原创美术资产，可直接在线体验。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23faf8f4'/%3E%3Ccircle cx='11.5' cy='13' r='2.1' fill='%2314110d'/%3E%3Ccircle cx='20.5' cy='13' r='2.1' fill='%2314110d'/%3E%3Cpath d='M8 21.5c3.2 1.7 12.8 1.7 16 0' stroke='%2314110d' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/hall.css" />
</head>
<body>
<a class="skip-link" href="#gallery">跳到作品列表</a>

<header class="topbar">
  <a class="brand" href="#top">
    <span class="brand-cn">回响电玩馆</span>
    <span class="brand-en">PLAYTIME ATLAS</span>
  </a>
  <div class="topbar-tools">
    <nav class="cats" id="cats" aria-label="作品分类"></nav>
    <div class="search">
      <label class="sr-only" for="q">搜索作品</label>
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><circle cx="6.8" cy="6.8" r="4.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 10.3 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="q" name="q" type="search" placeholder="搜索作品" autocomplete="off" spellcheck="false" />
    </div>
  </div>
</header>

<main id="top">
  <section id="gallery" class="gallery" aria-labelledby="gallery-label">
    <div class="gallery-head">
      <h1 class="gallery-label" id="gallery-label">作品<span class="gallery-label-en">Selected work</span></h1>
      <p class="sr-only" id="results-status" role="status" aria-live="polite"></p>
    </div>

    <div class="works" id="works" role="list"></div>

    <p class="empty" id="empty" hidden>
      没有匹配的作品。<button class="link-btn" id="clear-filters" type="button">清除筛选</button>
    </p>
  </section>
</main>

<footer class="footer">
  <p class="foot-brand">回响电玩馆 <span>PLAYTIME ATLAS</span></p>
  <p class="foot-copy">© 2026 · 个人作品画廊</p>
</footer>

<!-- ===================== 轻量详情 ===================== -->
<div class="overlay" id="overlay" hidden></div>
<section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden tabindex="-1">
  <button class="detail-close" id="detail-close" type="button" aria-label="关闭详情">✕</button>
  <div class="detail-body" id="detail-body"></div>
</section>

<!-- ===================== 体验台 ===================== -->
<section class="stage" id="stage" role="dialog" aria-modal="true" aria-labelledby="stage-name" hidden>
  <header class="stage-bar">
    <button class="stage-btn" id="stage-back" type="button">← 返回作品</button>
    <div class="stage-title">
      <b id="stage-name">—</b>
      <em id="stage-sub">—</em>
    </div>
    <button class="stage-btn" id="stage-open" type="button">独立窗口</button>
  </header>
  <div class="stage-body">
    <iframe id="stage-frame" title="作品体验区" allow="fullscreen; gamepad; autoplay; clipboard-write"></iframe>
  </div>
  <p class="stage-hint" id="stage-hint">点击画面以激活键盘与指针锁定。</p>
</section>

<script id="works-data" type="application/json">{}</script>
<script id="build-report" type="application/json">{}</script>
<script src="assets/hall.js" type="module"></script>
</body>
</html>
